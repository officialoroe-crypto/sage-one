name: SAGE ONE Website and Flutter Web QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "frontend/**"
      - ".github/workflows/sage-one-god-mode-pages.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "frontend/**"
      - ".github/workflows/sage-one-god-mode-pages.yml"

permissions:
  contents: read

concurrency:
  # PR runs are isolated from main/manual publication; production runs are never
  # cancelled by a newer run while a Pages deployment is in progress.
  group: sage-one-pages-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website and build Flutter web QA artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate current Freebuff website assets
        working-directory: .
        run: |
          test -s website/index.html
          test -s website/css/styles.css
          test -s website/js/app.js
          test -s website/js/backend.js
          test -s website/img/sage-mark.png
          python - <<'PY'
          from pathlib import Path

          html = Path("website/index.html").read_text(encoding="utf-8")
          required = (
              'href="css/styles.css',
              'src="js/app.js',
              'img/sage-mark.png',
          )
          missing = [fragment for fragment in required if fragment not in html]
          if missing:
              raise SystemExit(f"Current website asset references are missing: {missing}")
          print("Current Freebuff website entry point and primary assets are present.")
          PY

      - name: Check website JavaScript syntax
        working-directory: .
        run: |
          for file in website/js/*.js; do
            node --check "$file"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Test Flutter app
        run: flutter test

      - name: Build Flutter web app for QA only
        env:
          SAGE_API_URL: ${{ vars.SAGE_API_URL }}
        run: |
          if [ -n "$SAGE_API_URL" ]; then
            case "$SAGE_API_URL" in
              https://*) ;;
              *)
                echo "::error::SAGE_API_URL must use HTTPS when configured."
                exit 1
                ;;
            esac
            flutter build web --release --base-href /sage-one/app/ --dart-define="SAGE_API_URL=$SAGE_API_URL"
          else
            # This build is an inspection artifact, never part of public Pages output.
            flutter build web --release --base-href /sage-one/app/
          fi

      - name: Upload Flutter web QA artifact
        uses: actions/upload-artifact@v7
        with:
          name: sage-one-flutter-web-qa-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 7

  package-website:
    if: github.event_name != 'pull_request'
    name: Package the current Freebuff website only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package and validate website-only Pages output
        run: |
          test -s website/index.html
          test -s website/css/styles.css
          test -s website/js/app.js
          test -s website/js/backend.js
          test -s website/img/sage-mark.png
          mkdir -p public_site
          cp -R website/. public_site/
          test -s public_site/index.html
          test -s public_site/css/styles.css
          test -s public_site/js/app.js
          test -s public_site/js/backend.js
          test -s public_site/img/sage-mark.png
          test ! -e public_site/app/index.html

      - name: Upload website-only Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_site

  deploy-website:
    if: github.event_name != 'pull_request'
    name: Deploy the current website
    needs:
      - validate
      - package-website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
