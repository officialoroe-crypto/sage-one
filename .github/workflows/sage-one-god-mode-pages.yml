name: SAGE ONE Website and Web App QA (No Deployment)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "frontend/**"
      - "tests/test_website_quality_contract.py"
      - ".github/workflows/sage-one-god-mode-pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "frontend/**"
      - "tests/test_website_quality_contract.py"
      - ".github/workflows/sage-one-god-mode-pages.yml"

permissions:
  contents: read

concurrency:
  group: sage-one-website-qa-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  website-quality:
    name: Website links, metadata, labels and menu contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install website QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check website quality contract
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long tests/test_website_quality_contract.py 2>&1 | tee website-quality-test.log
      - name: Preserve website QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sage-one-website-quality-log-${{ github.sha }}
          path: website-quality-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Check website JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/chat/chat.js
          node --check website/app-preview/app.js

  web-app-qa:
    name: Analyze, test and build web app (artifact only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Test Flutter app
        run: flutter test
      - name: Build web app for QA only (never deploy)
        env:
          SAGE_API_URL: ${{ vars.SAGE_API_URL || 'https://sage-one-api.onrender.com' }}
        run: |
          case "$SAGE_API_URL" in
            https://*) ;;
            *)
              echo "::error::SAGE_API_URL must use HTTPS."
              exit 1
              ;;
          esac
          flutter build web --release --base-href /sage-one/app/ --dart-define="SAGE_API_URL=$SAGE_API_URL"
      - name: Upload web QA artifact (not a Pages artifact)
        uses: actions/upload-artifact@v7
        with:
          name: sage-one-web-qa-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 7
