name: SAGE ONE God Mode Developer Website

# Public Pages deployment is manual-only until the owner approves release readiness.
# A manual run publishes the Flutter web application to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /sage-one/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build/web
      - id: deployment
        uses: actions/deploy-pages@v5
