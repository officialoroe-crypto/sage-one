name: SAGE ONE Marketing Website and Web App QA

on:
  # QA only while the owner-requested product rebuild is underway.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "frontend/**"
      - ".github/workflows/sage-one-god-mode-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "frontend/**"
      - ".github/workflows/sage-one-god-mode-pages.yml"

permissions:
  contents: read

concurrency:
  # Keep pull-request validation separate from main builds and manual publication.
  group: sage-one-public-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && 'manual-deploy' || 'push-main') }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website and build web app for QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Test Flutter app
        run: flutter test
      - name: Validate imported workspace and local assets
        run: |
          for file in ../website/js/*.js; do
            node --check "$file"
          done
          python - <<'PY'
          from pathlib import Path

          site = Path("../website")
          html = (site / "index.html").read_text(encoding="utf-8")
          required = (
              'href="css/styles.css',
              'id="screen"',
              'id="tabbar"',
              'src="js/core.js',
              'src="js/screens-onboarding.js',
              'src="js/app.js',
              'src="js/backend.js',
          )
          missing = [fragment for fragment in required if fragment not in html]
          if missing:
              raise SystemExit(f"Workspace entry point is missing expected structure: {missing}")
          for filename in (
              "css/styles.css", "img/sage-mark.png", "js/core.js", "js/data.js",
              "js/components.js", "js/ai.js", "js/screens-onboarding.js",
              "js/screens-home.js", "js/screens-apps.js", "js/screens-system.js",
              "js/screens-lab.js", "js/screens-agents.js", "js/app.js", "js/backend.js",
          ):
              if not (site / filename).is_file():
                  raise SystemExit(f"Missing workspace asset: {filename}")
          print("Workspace entry point, referenced assets, and JavaScript syntax validated.")
          PY
      - name: Upload workspace source for QA
        uses: actions/upload-artifact@v7
        with:
          name: sage-one-website-workspace-qa-${{ github.sha }}
          path: website/
          if-no-files-found: error
          retention-days: 7
      - name: Build Flutter web app for QA (not Pages deployment)
        env:
          SAGE_API_URL: ${{ vars.SAGE_API_URL || 'https://sage-one-api.onrender.com' }}
        run: |
          case "$SAGE_API_URL" in
            https://*) ;;
            *)
              echo "::error::SAGE_API_URL must use HTTPS."
              exit 1
              ;;
          esac
          flutter build web --release --base-href / --dart-define="SAGE_API_URL=$SAGE_API_URL"
      - name: Upload web QA build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sage-one-web-qa-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 7

  backend-smoke:
    # Read-only health/config checks are safe on pull requests too. This job
    # does not deploy or mutate the live service.
    name: Smoke-test live backend for web integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SAGE_API_URL: ${{ vars.SAGE_API_URL || 'https://sage-one-api.onrender.com' }}
    steps:
      - name: Check live API health and owner sign-in configuration
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["SAGE_API_URL"].rstrip("/")
          if not base.startswith("https://"):
              raise SystemExit("SAGE_API_URL must use HTTPS for the web app.")

          def get_json(path):
              last_error = None
              for attempt in range(6):
                  try:
                      request = Request(base + path, headers={"Accept": "application/json"})
                      with urlopen(request, timeout=20) as response:
                          if response.status < 200 or response.status >= 300:
                              raise RuntimeError(f"{path} returned HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))
                  except (HTTPError, URLError, TimeoutError, RuntimeError, ValueError) as exc:
                      last_error = exc
                      if attempt < 5:
                          time.sleep(10)
              raise SystemExit(f"Backend smoke check failed for {path}: {last_error}")

          health = get_json("/health")
          if str(health.get("status", "")).lower() != "healthy":
              raise SystemExit(f"Backend health is not healthy: {health.get('status', 'missing status')}")

          identity = get_json("/identity/config")
          if identity.get("success") is not True:
              raise SystemExit("Identity config endpoint did not return success=true.")
          if not str(identity.get("google_client_id", "")).strip():
              raise SystemExit("Google sign-in is not configured: backend returned an empty google_client_id.")
          if identity.get("developer_mode") is not False:
              raise SystemExit("Hosted backend must explicitly disable Developer Mode.")
          if identity.get("owner_mode_available") is not True:
              raise SystemExit("Hosted backend must have the configured owner identity available.")

          # Confirm the live Chat endpoint rejects unauthenticated callers.
          # This request must not create a session or invoke a model.
          probe = Request(
              base + "/chat",
              data=json.dumps({"message": "unauthenticated security smoke test"}).encode("utf-8"),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          try:
              with urlopen(probe, timeout=20) as response:
                  raise SystemExit(
                      f"Unauthenticated /chat unexpectedly returned HTTP {response.status}."
                  )
          except HTTPError as exc:
              if exc.code != 401:
                  raise SystemExit(f"Unauthenticated /chat returned HTTP {exc.code}; expected 401.")
          print("PASS: live backend health endpoint is healthy.")
          print("PASS: identity configuration endpoint is reachable and Google sign-in is configured.")
          print("PASS: live Chat rejects unauthenticated requests with HTTP 401.")
          print("PASS: web build target:", base)
          PY

