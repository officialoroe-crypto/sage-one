name: SAGE ONE Web Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/sage-one-ui-v1, feature/dev-mode-local, feature/dev-mode-local-v2]
  pull_request:
    branches: [main]

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: sage-one-web-preview
          path: frontend/build/web
