name: SAGE ONE Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
      - name: Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        run: flutter analyze
      - name: Flutter tests
        working-directory: frontend
        run: flutter test
      - name: Build web
        working-directory: frontend
        run: flutter build web --release --base-href /sage-one/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
