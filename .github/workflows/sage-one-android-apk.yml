name: SAGE ONE Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "SAGE backend URL reachable from the Android device"
        required: false
        default: "http://127.0.0.1:8010"
        type: string
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SAGE_ANDROID_API_URL: ${{ inputs.api_url || vars.SAGE_ANDROID_API_URL || 'http://127.0.0.1:8010' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sageone --project-name sage_one --no-pub .
      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --dart-define=SAGE_API_URL="$SAGE_ANDROID_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: sage-one-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
